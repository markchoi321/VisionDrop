			shellPath = /bin/sh;
			shellScript = "# 校验测试侧向量与 protocol/ 下的权威副本一致，防止两份副本漂移\n# dense/ 是 VD-D1 金图像，权威副本在 protocol/dense/golden，单独比对\nset -e\nSRC=\"${SRCROOT}/../protocol/vectors\"\nDST=\"${SRCROOT}/VisionDropTests/vectors\"\nif [ -d \"$SRC\" ]; then\n  if ! diff -r -x dense \"$SRC\" \"$DST\" > /dev/null 2>&1; then\n    echo \"error: VisionDropTests/vectors 与 protocol/vectors 不一致，请执行 cp protocol/vectors/* receiver/VisionDropTests/vectors/\"\n    exit 1\n  fi\nfi\nGSRC=\"${SRCROOT}/../protocol/dense/golden\"\nGDST=\"${DST}/dense\"\nif [ -d \"$GSRC\" ]; then\n  if ! diff -r \"$GSRC\" \"$GDST\" > /dev/null 2>&1; then\n    echo \"error: VisionDropTests/vectors/dense 与 protocol/dense/golden 不一致，请执行 python3 protocol/dense/gen_golden.py --sync\"\n    exit 1\n  fi\nfi\n";
		};
