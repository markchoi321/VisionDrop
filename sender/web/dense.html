<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionDrop 密集 8 色发送端</title>
<style>
body { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
       margin: 0; padding: 12px; background: #f4f4f4; color: #222; }
h1 { font-size: 18px; margin: 0 0 10px 0; }
.panel { background: #fff; border: 1px solid #ddd; padding: 10px;
         margin-bottom: 10px; }
.row { margin: 6px 0; }
label { margin-right: 4px; }
select, input, button { font-size: 14px; padding: 3px 6px; }
button { cursor: pointer; margin-right: 6px; }
#qrwrap { text-align: center; background: #fff; border: 1px solid #ddd;
          padding: 8px 0; }
#info td { padding: 2px 10px 2px 0; font-size: 13px; }
#stats { font-size: 13px; color: #444; }
#err { color: #b00020; }
.hint { color: #888; font-size: 12px; }
.warn { color: #a05a00; font-size: 12px; }
</style>
</head>
<body>
<h1>VisionDrop 密集 8 色发送端（VD-D1）</h1>

<div class="panel">
    <div class="row">
        <input type="file" id="filepick">
        <span id="err"></span>
    </div>
    <div class="row hint">
        物理层 VD-D1：8 色格阵（每格 3 bit，RGB 立方体调色板），
        载荷为标准 L2 帧。规约见 protocol/dense/DENSE.md。
    </div>
</div>

<div class="panel" id="sesspanel" style="display:none">
    <table id="info">
        <tr><td>文件</td><td id="i_file"></td>
            <td>大小</td><td id="i_size"></td></tr>
        <tr><td>编码方案</td><td id="i_codec"></td>
            <td>会话 sessionId</td><td id="i_sid"></td></tr>
        <tr><td>块大小 T</td><td id="i_T"></td>
            <td>源块数 K</td><td id="i_K"></td></tr>
    </table>
    <div class="row">
        <label for="tier">档位</label>
        <select id="tier"></select>
        <label for="interval">间隔(ms)</label>
        <input type="number" id="interval" value="150" min="16" step="1" style="width:70px">
        <span class="hint">会自动量化成刷新周期的整数倍；填 16 即每个刷新周期换一帧</span>
    </div>
    <div class="row">
        <button id="btn_play">开始播放</button>
        <button id="btn_reset">重置块序号</button>
        <button id="btn_dump">导出帧转储</button>
    </div>
    <div class="row" id="stats"></div>
</div>

<div id="qrwrap" style="display:none">
    <canvas id="symcanvas" width="300" height="300"></canvas>
</div>

<script src="vd-protocol.js"></script>
<script src="vd-dense.js"></script>
<script>
(function () {
    "use strict";

    var errEl = document.getElementById("err");
    if (typeof Uint8Array === "undefined" || typeof FileReader === "undefined") {
        errEl.innerHTML = "此浏览器过旧：缺少 File API 或类型化数组（需要 IE10+ / Android 4+ / Safari 5.1+）";
        return;
    }

    var sess = null;
    var content = null;       /* 原始文件内容，换档要用它重建会话 */
    var fileName = "";
    var tiers = [];           /* [{N, net, m, T, frames}] */
    var tierIdx = 0;
    var nextBlockId = 0;      /* 游标：仅在帧真正显示后推进 */
    var framesShown = 0;
    var playing = false;
    var canvas = document.getElementById("symcanvas");
    var ctx = canvas.getContext("2d");

    var $ = function (id) { return document.getElementById(id); };

    /* 密集模式的持久化键 */
    function stateKey() { return "vdweb.dense." + VDP.sessionIdHex(sess.sid); }

    function loadState() {
        try {
            var raw = window.localStorage.getItem(stateKey());
            if (!raw) { return; }
            var st = JSON.parse(raw);
            nextBlockId = st.nextBlockId % 4294967296 || 0;
            framesShown = st.framesShown || 0;
            if (st.intervalMs >= 16) { $("interval").value = st.intervalMs; }
        } catch (e) { /* localStorage 不可用时静默跳过 */ }
    }

    function saveState() {
        try {
            window.localStorage.setItem(stateKey(), JSON.stringify({
                nextBlockId: nextBlockId,
                framesShown: framesShown,
                intervalMs: parseInt($("interval").value, 10) || 150
            }));
        } catch (e) { /* 同上 */ }
    }

    function fmtSize(n) {
        if (n < 1024) { return n + " B"; }
        if (n < 1048576) { return (n / 1024).toFixed(1) + " KB"; }
        return (n / 1048576).toFixed(2) + " MB";
    }

    /*
     * 密集档位。**每档各自选自己的 T**，而不是全档共用一个。
     *
     * 帧长必须是 20 + m*T，所以单档的浪费是 (净容量 - 20) mod T。一个 T 不可能
     * 让五档都装满：实测某 1.2 MB 文件用单一 T=488（还是按默认容量表挑的）时，
     * 各档填充率只有 80%–96%，N=80 档白扔 20%；改成每档各自选 T 后五档全部 100%，
     * 一轮所需帧数 N=80 降 20%、N=96 降 11%、N=112 降 10%。
     * 代价是 T 变了 sessionId 就变，因此换档等于换会话，游标要重来——
     * 这在换档本就是「重新开始一轮」的语义下是可接受的。
     */
    function buildTiers(streamLen) {
        var out = [];
        for (var i = 0; i < VDD.GRID_SIZES.length; i++) {
            var N = VDD.GRID_SIZES[i];
            var net = VDD.capacity(N).net;
            var p = VDP.pickParams(streamLen, net);
            var m = Math.min(255, Math.floor((net - 20) / p.T));
            if (m < 1) { continue; }
            var eps = p.codec === VDP.CODEC_RLNC ? VDP.epsRlnc(p.K) : VDP.epsLt(p.K);
            out.push({ N: N, net: net, m: m, T: p.T,
                       frames: Math.ceil(Math.ceil(p.K * (1 + eps)) / m) });
        }
        return out;
    }

    function currentPassFrames() {
        var m = tiers[tierIdx].m;
        var eps = sess.codec === VDP.CODEC_RLNC ? VDP.epsRlnc(sess.K) : VDP.epsLt(sess.K);
        return Math.ceil(Math.ceil(sess.K * (1 + eps)) / m);
    }

    /* 切到第 idx 档：按该档容量重建会话（T 随之改变），游标归零 */
    function applyTier(idx) {
        tierIdx = idx;
        try {
            sess = new VDP.SendSession(content, fileName, tiers[idx].net);
        } catch (e) {
            errEl.innerHTML = "会话创建失败: " + e.message;
            return false;
        }
        tiers[idx].m = Math.min(255, Math.floor((tiers[idx].net - 20) / sess.T));
        nextBlockId = 0;
        framesShown = 0;
        loadState();
        showSession();
        return true;
    }

    function showSession() {
        $("i_file").innerHTML = sess.fileName;
        $("i_size").innerHTML = fmtSize(sess.contentLen) +
            "（流层 " + fmtSize(sess.stream.length) + "）";
        $("i_codec").innerHTML = sess.codec === VDP.CODEC_RLNC ? "解方程(RLNC)" : "剥洋葱(LT)";
        $("i_sid").innerHTML = VDP.sessionIdHex(sess.sid);
        $("i_T").innerHTML = sess.T;
        $("i_K").innerHTML = sess.K;
        $("sesspanel").style.display = "";
        refreshStats();
    }

    function refreshStats() {
        /* stop() 也会调它，而选文件的第一步就是 stop()，此时还没有会话 */
        if (!sess || !tiers.length) { return; }
        var h = currentHold();
        var fps = 0;
        if (presentTs.length >= 2) {
            fps = 1000 * (presentTs.length - 1) /
                  (presentTs[presentTs.length - 1] - presentTs[0]);
        }
        $("stats").innerHTML = "已播帧数 " + framesShown +
            " ｜ 下一块序号 " + nextBlockId +
            " ｜ 当前档一轮约需 " + currentPassFrames() + " 帧" +
            " ｜ 显示间隔 " + h.hold.toFixed(1) + " ms（" + h.k + " × " +
            h.P.toFixed(1) + " ms 刷新周期）" +
            (fps > 0 ? " ｜ 实测 " + fps.toFixed(1) + " fps" : "") +
            (starved > 0 ? " ｜ <span class=\"warn\">欠载保帧 " + starved +
                           " 次（间隔太激进或档位太重）</span>" : "");
    }

    function fillTierSelect() {
        var sel = $("tier");
        sel.innerHTML = "";
        for (var i = 0; i < tiers.length; i++) {
            var t = tiers[i];
            var opt = document.createElement("option");
            opt.value = i;
            var fill = Math.round(100 * (20 + t.m * t.T) / t.net);
            opt.text = "档" + (i + 1) + "  " + t.N + "格  每帧 " + t.m +
                " 块  一轮 " + t.frames + " 帧  填充 " + fill + "%";
            sel.appendChild(opt);
        }
        sel.selectedIndex = tierIdx;
    }

    var MARGIN = VDD.QUIET;   /* 静区 2 格 */
    var RING_CAP = 3;         /* 预渲染深度 */

    /*
     * 8 色调色板的 RGBA32 查找表。
     *
     * 原先逐格 fillRect：N=128 时是 16384 次绘制调用，外加 16384 次 CSS 颜色
     * 字符串解析，光这一项就塞不进一个 16.7 ms 的刷新周期。改成往 ImageData
     * 里写 uint32、一次 putImageData 提交。按字节写 RGBA、按 uint32 读回，
     * 字节序自动适配，不必判断大小端。
     */
    var PAL32 = (function () {
        var buf = new ArrayBuffer(4);
        var u8 = new Uint8Array(buf), u32 = new Uint32Array(buf);
        var lut = new Uint32Array(8);
        for (var v = 0; v < 8; v++) {
            u8[0] = (v & 4) ? 255 : 0;    /* bit2 = R */
            u8[1] = (v & 2) ? 255 : 0;    /* bit1 = G */
            u8[2] = (v & 1) ? 255 : 0;    /* bit0 = B */
            u8[3] = 255;
            lut[v] = u32[0];
        }
        return lut;
    })();

    var now = (window.performance && window.performance.now)
        ? function () { return window.performance.now(); }
        : function () { return new Date().getTime(); };

    var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame;
    var caf = window.cancelAnimationFrame || window.webkitCancelAnimationFrame;
    if (!raf) {
        raf = function (fn) { return window.setTimeout(function () { fn(now()); }, 16); };
        caf = function (id) { window.clearTimeout(id); };
    }

    /* ---------------------------------------------- 预渲染流水线 */

    var geo = null;           /* {n, dim, px, size}，仅换档/改窗口时重算 */
    var slots = [];           /* 环形缓冲，元素是 1 px/格 的离屏画布 */
    var qHead = 0, qTail = 0, qCount = 0;
    var encodeBlockId = 0;    /* 预渲染游标，跑在显示游标 nextBlockId 前面 */

    function computeGeom() {
        var n = tiers[tierIdx].N;
        var dim = n + MARGIN * 2;
        var avail = Math.min(
            (window.innerWidth || document.documentElement.clientWidth) - 40,
            (window.innerHeight || document.documentElement.clientHeight) - 60);
        if (avail < 100) { avail = 100; }
        var px = Math.floor(avail / dim);
        if (px < 1) { px = 1; }
        return { n: n, dim: dim, px: px, size: dim * px };
    }

    function makeSlot(dim) {
        var cv = document.createElement("canvas");
        cv.width = dim;
        cv.height = dim;
        var c2 = cv.getContext("2d");
        var img = c2.createImageData(dim, dim);
        var u32 = new Uint32Array(img.data.buffer);
        /* 静区恒为白，只在这里刷一次，逐帧只重写内部 n×n */
        for (var i = 0; i < u32.length; i++) { u32[i] = PAL32[7]; }
        return { cv: cv, ctx: c2, img: img, u32: u32, dim: dim, blockIdAfter: 0 };
    }

    /*
     * 重建流水线。画布尺寸只在这里改——原先每帧都写 canvas.width，那会清空
     * 后备存储并可能触发一次 layout，换帧瞬间合成器有机会拿到空白或旧内容。
     */
    function rebuildPipeline() {
        geo = computeGeom();
        if (canvas.width !== geo.size) {
            canvas.width = geo.size;
            canvas.height = geo.size;
        }
        /* 改尺寸会重置 2D 上下文状态，插值开关必须跟着重设 */
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.msImageSmoothingEnabled = false;
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, geo.size, geo.size);

        slots = [];
        for (var i = 0; i < RING_CAP; i++) { slots.push(makeSlot(geo.dim)); }
        qHead = 0; qTail = 0; qCount = 0;
        encodeBlockId = nextBlockId;
    }

    /* 生产一帧进缓冲。返回 false 表示缓冲已满 */
    function produceFrame() {
        if (!geo || qCount >= RING_CAP) { return false; }
        var t = tiers[tierIdx];
        var frame = sess.encodeFrame(encodeBlockId, t.m);
        var sym = VDD.encode(frame, t.N);
        var slot = slots[qTail];
        var cells = sym.cells, n = sym.n, dim = slot.dim, u32 = slot.u32;
        for (var r = 0; r < n; r++) {
            var src = r * n;
            var dst = (r + MARGIN) * dim + MARGIN;
            for (var c = 0; c < n; c++) { u32[dst + c] = PAL32[cells[src + c]]; }
        }
        slot.ctx.putImageData(slot.img, 0, 0);
        encodeBlockId = (encodeBlockId + t.m) % 4294967296;
        slot.blockIdAfter = encodeBlockId;
        qTail = (qTail + 1) % RING_CAP;
        qCount++;
        return true;
    }

    /*
     * 呈现一帧。换帧动作只剩一次 drawImage——离屏位图按整数倍最近邻放大，
     * 是一次位块搬运。它跑在 rAF 回调里，浏览器在回调结束时统一提交，
     * 屏幕上不会出现半张图。
     */
    function presentFrame() {
        var slot = slots[qHead];
        qHead = (qHead + 1) % RING_CAP;
        qCount--;
        ctx.drawImage(slot.cv, 0, 0, geo.size, geo.size);
        nextBlockId = slot.blockIdAfter;   /* 游标仍然只在帧真正显示后推进 */
        framesShown++;
    }

    /* ---------------------------------------------- vsync 对齐的调度 */

    var rafId = null;
    var lastRafTs = 0;
    var vsyncP = 0;           /* 刷新周期估计 */
    var rafDeltas = [];       /* 最近 2 秒的 rAF 间隔，取最小值作周期 */
    var lastPresentTs = 0;
    var starved = 0;          /* 缓冲欠载导致的保帧次数 */
    var lastStatsTs = 0, lastSaveTs = 0;
    var presentTs = [];       /* 最近若干次呈现时刻，用来报实测 fps */

    /*
     * 把用户填的间隔量化成刷新周期的整数倍。
     *
     * setTimeout 的间隔和刷新周期没有公约数，换帧点在刷新周期内随机漂移，
     * 每帧的实际显示时长在 ±1 个刷新周期内跳动——接收端看到的稳定窗口是抖的。
     * 对齐之后每帧显示时长恒定，"曝光落在稳定期"的概率才是可算的。
     */
    function currentHold() {
        var P = vsyncP || 16.7;
        var want = parseInt($("interval").value, 10) || 150;
        var k = Math.round(want / P);
        if (k < 1) { k = 1; }
        return { P: P, k: k, hold: k * P };
    }

    function frameLoop(ts) {
        if (!playing) { return; }
        rafId = raf(frameLoop);

        /*
         * 刷新周期估计：掉帧只会让 rAF 间隔变大、不会变小，所以近期最小值就是
         * 真实周期。用滑动窗口而不是全程最小值——否则一次偶发的异常小间隔会把
         * 估计永久钉死，显示器中途换刷新率（ProMotion 120→60）也跟不上。
         */
        if (lastRafTs > 0) {
            var d = ts - lastRafTs;
            if (d >= 4 && d <= 200) {
                rafDeltas.push(d);
                if (rafDeltas.length > 120) { rafDeltas.shift(); }
                var mn = rafDeltas[0];
                for (var i = 1; i < rafDeltas.length; i++) {
                    if (rafDeltas[i] < mn) { mn = rafDeltas[i]; }
                }
                vsyncP = mn;
            }
        }
        lastRafTs = ts;

        var h = currentHold();
        if (lastPresentTs === 0 || ts - lastPresentTs >= h.hold - h.P * 0.5) {
            if (qCount > 0) {
                presentFrame();
                lastPresentTs = ts;
                presentTs.push(ts);
                if (presentTs.length > 30) { presentTs.shift(); }
            } else {
                /*
                 * 缓冲空了。宁可让上一帧多显示一个周期（接收端按重复帧丢掉，
                 * 只损失一点吞吐），也绝不呈现半成品——废帧就是这么来的。
                 */
                starved++;
            }
        }

        /* 本帧剩下的时间拿去预渲染，预算取显示间隔的六成，给合成留余量 */
        var budget = Math.max(4, h.hold * 0.6);
        var t0 = now();
        try {
            while (qCount < RING_CAP && now() - t0 < budget) {
                if (!produceFrame()) { break; }
            }
        } catch (e) {
            stop();
            errEl.innerHTML = "编码出错: " + e.message;
            return;
        }

        if (ts - lastStatsTs > 250) { refreshStats(); lastStatsTs = ts; }
        if (ts - lastSaveTs > 2000) { saveState(); lastSaveTs = ts; }
    }

    function play() {
        if (!sess || playing) { return; }
        playing = true;
        $("btn_play").innerHTML = "暂停";
        $("qrwrap").style.display = "";
        lastRafTs = 0; lastPresentTs = 0; vsyncP = 0; rafDeltas = [];
        starved = 0; presentTs = [];
        lastStatsTs = 0; lastSaveTs = 0;
        try {
            rebuildPipeline();
            while (qCount < RING_CAP) { if (!produceFrame()) { break; } }
        } catch (e) {
            playing = false;
            $("btn_play").innerHTML = "开始播放";
            errEl.innerHTML = "编码出错: " + e.message;
            return;
        }
        rafId = raf(frameLoop);
    }

    function stop() {
        playing = false;
        $("btn_play").innerHTML = "开始播放";
        if (rafId !== null) { caf(rafId); rafId = null; }
        saveState();
        refreshStats();
    }

    /* 帧转储导出（契约 14 格式） */
    function exportDump() {
        if (!sess) { return; }
        var t = tiers[tierIdx];
        var count = currentPassFrames();
        var parts = [];
        var total = 0;
        var base = 0;
        for (var f = 0; f < count; f++) {
            var frame = sess.encodeFrame(base, t.m);
            var rec = new Uint8Array(4 + frame.length);
            rec[0] = (frame.length >>> 24) & 0xFF;
            rec[1] = (frame.length >>> 16) & 0xFF;
            rec[2] = (frame.length >>> 8) & 0xFF;
            rec[3] = frame.length & 0xFF;
            rec.set(frame, 4);
            parts.push(rec);
            total += rec.length;
            base = (base + t.m) % 4294967296;
        }
        var all = new Uint8Array(total);
        var off = 0;
        for (var i = 0; i < parts.length; i++) { all.set(parts[i], off); off += parts[i].length; }
        var name = VDP.sessionIdHex(sess.sid) + "-dense.vddump";
        try {
            var blob = new Blob([all], { type: "application/octet-stream" });
            if (window.navigator.msSaveBlob) {
                window.navigator.msSaveBlob(blob, name);
                return;
            }
            var a = document.createElement("a");
            a.href = (window.URL || window.webkitURL).createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } catch (e) {
            errEl.innerHTML = "此浏览器不支持文件导出";
        }
    }

    $("filepick").addEventListener("change", function () {
        var f = this.files && this.files[0];
        if (!f) { return; }
        stop();
        errEl.innerHTML = "";
        var reader = new FileReader();
        reader.onload = function () {
            content = new Uint8Array(reader.result);
            fileName = f.name;
            /* 先建一次拿到流层长度（档位表要按它算每档的 T），再按选定档位重建 */
            try {
                sess = new VDP.SendSession(content, fileName,
                                           VDD.capacity(VDD.GRID_SIZES[0]).net);
            } catch (e) {
                errEl.innerHTML = "会话创建失败: " + e.message;
                return;
            }
            tiers = buildTiers(sess.stream.length);
            if (tiers.length === 0) {
                errEl.innerHTML = "文件过大，无可用密集档位";
                $("sesspanel").style.display = "none";
                return;
            }
            fillTierSelect();
            var last = parseInt(window.localStorage
                ? window.localStorage.getItem("vdweb.dense.lastTier") : "", 10);
            if (!(last >= 0 && last < tiers.length)) {
                last = Math.floor((tiers.length - 1) / 2);
            }
            if (!applyTier(last)) { return; }
            $("tier").selectedIndex = tierIdx;
        };
        reader.onerror = function () { errEl.innerHTML = "文件读取失败"; };
        reader.readAsArrayBuffer(f);
    });

    $("btn_play").addEventListener("click", function () {
        if (playing) { stop(); } else { play(); }
    });

    $("btn_reset").addEventListener("click", function () {
        nextBlockId = 0;
        framesShown = 0;
        /* 缓冲里已按旧游标编好的帧作废，预渲染游标退回显示游标 */
        qHead = 0; qTail = 0; qCount = 0;
        encodeBlockId = 0;
        saveState();
        refreshStats();
    });

    /*
     * 窗口尺寸变了要重建离屏缓冲。防抖 200 ms——拖动窗口期间反复重建离屏画布，
     * 只会把预渲染预算吃光，反而制造欠载。
     */
    var resizeTimer = null;
    window.addEventListener("resize", function () {
        if (!sess || !playing) { return; }
        if (resizeTimer) { window.clearTimeout(resizeTimer); }
        resizeTimer = window.setTimeout(function () {
            resizeTimer = null;
            if (!playing) { return; }
            try {
                rebuildPipeline();
                while (qCount < RING_CAP) { if (!produceFrame()) { break; } }
            } catch (e) {
                stop();
                errEl.innerHTML = "编码出错: " + e.message;
            }
        }, 200);
    });

    $("btn_dump").addEventListener("click", exportDump);

    $("tier").addEventListener("change", function () {
        /* 换档 = 换 T = 换 sessionId，会话必须重建、游标归零。
           接收端会把它当成一个新会话，这与「换档就是重开一轮」的语义一致。 */
        stop();
        try {
            window.localStorage.setItem("vdweb.dense.lastTier", String(this.selectedIndex));
        } catch (e) { /* localStorage 不可用时静默跳过 */ }
        applyTier(this.selectedIndex);
    });

    $("interval").addEventListener("change", function () {
        saveState();
        refreshStats();
    });
})();
</script>
</body>
</html>
